apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder-service
  template:
    metadata:
      labels:
        app: reminder-service
    spec:
      containers:
        - name: reminder-service
          image: skillsphere-reminder-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: reminder-service-config
            - secretRef:
                name: reminder-service-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
