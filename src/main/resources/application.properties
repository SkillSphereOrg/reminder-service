spring.application.name=reminder-service

# Database (for reminder preferences)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reminder_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

# Mail
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=no-reply@skillsphere.com

# Actuator
management.endpoints.web.exposure.include=health,info

# Scheduling
spring.task.scheduling.pool.size=2

# Integration URLs
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8080}
skill.service.url=${SKILL_SERVICE_URL:http://localhost:8081}

server.port=8082
